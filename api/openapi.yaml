openapi: 3.0.3
info:
  title: Cross-border Pay
  version: 0.1.0
  description: |
    A merchant abroad charges in USD; a payer in Brazil pays in BRL. Every amount is an
    integer in minor units (2000 is US$ 20.00); a decimal value is rejected. Errors are
    RFC 9457 problem details with a stable `code`.
servers:
  - url: http://localhost:8080
security:
  - apiKey: []

paths:
  /v1/payments:
    post:
      operationId: createPayment
      summary: Create a payment, priced in BRL by a quote valid for 30 minutes
      description: |
        A PIX payment comes back pending with its BR Code. A card payment is
        authorized and captured as it is created (decision 18), so it comes back
        `paid` with `card.status: captured`, or pending with `declined`. With
        `card.capture_method: manual` it is only authorized: pending with
        `authorized`, its quote valid for the authorization's 7 days, until
        `POST /v1/payments/{id}/capture`. A boleto payment needs `payer` and comes
        back pending with its barcode and linha digitável, due three days later; it
        is received until the end of the first banking day on or after the due date
        in São Paulo, and the quote lasts until then (decisions 44 and 53).

        A merchant whose available, pending and reserved money together is below
        -US$ 1,000.00, after refunds or chargebacks of settled money, gets
        `422 debt_limit_exceeded` and no payment (decision 27).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
            examples:
              pix:
                value:
                  amount: { value: 2000, currency: USD }
                  method: pix
                  reference: order-123
              card:
                value:
                  amount: { value: 2000, currency: USD }
                  method: card
                  reference: order-124
                  card: { token: tok_approved }
              boleto:
                value:
                  amount: { value: 2000, currency: USD }
                  method: boleto
                  reference: order-125
                  payer: { name: Maria Silva, document: 529.982.247-25, email: maria@example.com }
      responses:
        "201":
          description: The payment, pending until the payer pays.
          headers:
            Location:
              schema: { type: string, example: /v1/payments/pay_06f1z4ghq3m5ttqb0gnsx4yy3c }
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          description: |
            `idempotency_key_in_progress`: another request with this Idempotency-Key is
            still running. Retry later; it is never answered for a finished request.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listPayments
      summary: List the merchant's payments, newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page. Opaque.
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PaymentStatus"
      responses:
        "200":
          description: One page of payments.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/payments/{id}:
    get:
      operationId: getPayment
      summary: Get one of the merchant's payments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PaymentId"
      responses:
        "200":
          description: The payment and the quote that priced it.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          description: |
            No such payment. Also the answer for another merchant's payment and for a
            malformed ID, so it never tells whether a payment exists.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/payments/{id}/cancel:
    post:
      operationId: cancelPayment
      summary: Cancel a payment before it is paid
      description: |
        Asks the provider first: a payer who already paid is confirmed, and the cancel
        answers 409. Canceling a canceled payment answers 200 with it unchanged, so the
        request needs no Idempotency-Key. Money the payer sends after the cancel is held
        for review and returned (decision 8).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PaymentId"
      responses:
        "200":
          description: The canceled payment.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/PaymentNotFound"
        "409":
          description: |
            `payment_not_cancelable`: the payment is not pending, e.g. paid or expired.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          description: |
            `provider_unavailable`: the provider could not say whether the payer already
            paid. Nothing changed; retry later.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/payments/{id}/capture:
    post:
      operationId: capturePayment
      summary: Capture an authorized card payment, in whole or in part
      description: |
        For a card payment created with `card.capture_method: manual` (decision 18).
        With no body, or no `amount`, the whole payment is captured. A smaller amount
        is a partial capture: it is priced at the payment's locked rate, the fee is on
        what was captured, the rest of the authorization is released, and refunds stop
        at what was captured. An authorization is captured once and needs no
        Idempotency-Key: the same capture again answers 200 with the payment as it is,
        and another amount answers 409 `capture_amount_conflict`. If the acquirer's
        answer is lost, the payment comes back pending with `card.status: processing`
        until it is known.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PaymentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapturePaymentRequest"
            example:
              amount: { value: 1500, currency: USD }
      responses:
        "200":
          description: "The payment, `paid` with `card.status: captured`, or still pending with `processing`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/PaymentNotFound"
        "409":
          description: |
            `payment_not_capturable`: not an authorized card payment that is still
            pending. `capture_amount_conflict`: already captured, or being captured, for
            another amount. `capture_in_progress`: an earlier capture's answer is not
            known yet. `authorization_expired`: 7 days passed (decision 52).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          description: |
            `capture_exceeds_authorization`: more than the payment's amount.
            `invalid_amount`: not positive, or not in USD.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /v1/payments/{id}/refunds:
    post:
      operationId: refundPayment
      summary: Refund part or all of a paid payment
      description: |
        Returns `amount`, in the payment's currency, by the proportion of the original
        payment (decision 13): the payer gets back the same share of the reais they paid,
        the merchant's balance loses the whole amount (the fee is not returned). The
        refunds of a payment never pass what was paid, even when sent at the same time.
        Answered 201 whatever the provider said; `status` tells whether the money went
        back, will not, or is on its way, and `refund.succeeded` or `refund.failed`
        follows on the webhook.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PaymentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
            example:
              amount: { value: 1000, currency: USD }
      responses:
        "201":
          description: The refund.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/PaymentNotFound"
        "409":
          description: |
            `payment_not_refundable`: the payment is not paid, or already refunded in
            full. `idempotency_key_in_progress`: another request with this key is running.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          description: |
            `refund_exceeds_payment`: with the refunds that still count, this one would
            pass what was paid. `refund_too_small`: it rounds to nothing in reais.
            `invalid_amount`, `unsupported_currency`, `idempotency_key_reused`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /v1/providers/{provider}/events:
    post:
      operationId: receiveProviderEvent
      summary: Receive an event from a payment provider (webhook)
      description: |
        Called by the provider, not by merchants: the provider's signature is the
        authentication. The event is only stored here and applied by the worker
        (decision 19). A redelivered event is answered 200 too, so the provider stops
        sending it; only a failure to store asks for a redelivery.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            example: pixsim
        - name: Pixsim-Signature
          in: header
          required: false
          description: The simulator's signature, `t=<unix>,v1=<hex HMAC-SHA256 of t.body>`.
          schema:
            type: string
      requestBody:
        required: true
        description: The event exactly as the provider signed it.
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Stored, or already stored by an earlier delivery.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [received]
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/balance:
    get:
      operationId: getBalance
      summary: What the platform holds for the merchant, in USD
      description: |
        `available` is what the daily settlement would pay out now; `pending` is the net
        of payments not available yet (PIX D+1, boleto D+2, card D+30, in São Paulo
        calendar days), less their refunds. `available` is negative when refunds of
        settled payments exceed what came in since: nothing is paid out until it is
        positive again. `reserved` is held against chargebacks; it is zero for now.
      responses:
        "200":
          description: The balance.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
              example:
                available: { value: 1940, currency: USD }
                pending: { value: 940, currency: USD }
                reserved: { value: 0, currency: USD }
        "401":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/settlements:
    get:
      operationId: listSettlements
      summary: The merchant's settlements, newest cutoff first, with the payments in each
      description: |
        One settlement at most per cutoff date (São Paulo local date). Each payment is
        in the first settlement after it became available; a refund of a settled
        payment comes out of a later settlement's amount, not out of its list.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page. Opaque.
          schema: { type: string }
      responses:
        "200":
          description: One page of settlements.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementList"
        "400":
          description: "`invalid_limit` or `invalid_cursor`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/chargebacks/{id}:
    get:
      operationId: getChargeback
      summary: Get a chargeback of one of the merchant's payments
      description: |
        A chargeback is the cardholder's bank taking a card payment's money back
        (section 4.7). The money leaves the merchant's balance when it opens, which can
        leave the balance negative (decision 27); `chargeback.opened` tells the
        merchant, with its ID. A refunded payment can still be charged back, and the
        money then leaves twice (decision 7): contest it with the refund as evidence.
      parameters:
        - $ref: "#/components/parameters/ChargebackId"
      responses:
        "200":
          description: The chargeback.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chargeback"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          description: No chargeback with this ID on the merchant's payments.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/chargebacks/{id}/accept:
    post:
      operationId: acceptChargeback
      summary: Give a chargeback up
      description: |
        The chargeback is lost at once and `chargeback.lost` is sent; the money stays
        with the cardholder. Accepting a chargeback already accepted answers 200 with
        it unchanged, so the request needs no Idempotency-Key.
      parameters:
        - $ref: "#/components/parameters/ChargebackId"
      responses:
        "200":
          description: The chargeback, lost.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chargeback"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: "`chargeback_closed`: it is contested or decided already."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/AcquirerUnavailable"

  /v1/chargebacks/{id}/contest:
    post:
      operationId: contestChargeback
      summary: Contest a chargeback with evidence
      description: |
        The evidence goes to the acquirer and the chargeback is `under_review` until the
        issuer decides; `chargeback.won` gives the money back to the merchant's balance,
        `chargeback.lost` keeps it with the cardholder. Contesting a chargeback already
        under review answers 200 with it unchanged.
      parameters:
        - $ref: "#/components/parameters/ChargebackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContestChargebackRequest"
      responses:
        "200":
          description: The chargeback, under review.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chargeback"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: "`chargeback_closed`: it is accepted or decided already."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`invalid_evidence`: evidence must have 1 to 2000 characters."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/AcquirerUnavailable"

  /v1/events:
    get:
      operationId: listEvents
      summary: The merchant's webhook events, newest first, with where each delivery stands
      description: |
        `event` is the body every delivery posts, byte for byte. Delivered events are
        kept for 30 days; pending and failed ones until they are delivered.
      parameters:
        - name: delivery_status
          in: query
          schema: { type: string, enum: [pending, delivered, failed] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page of events.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          description: "`invalid_limit`, `invalid_delivery_status` or `invalid_cursor`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/events/{id}/redeliver:
    post:
      operationId: redeliverEvent
      summary: Deliver an event again, now, with a new 72-hour retry window
      description: |
        From any status: a failed event is retried, a delivered one sent again, a
        pending one sent without waiting for its backoff. The retries restart from 30
        seconds and give up 72 hours after this request. Repeating it only queues the
        event again, so it needs no `Idempotency-Key`. A post already in flight may
        still arrive too; drop the duplicate by `id`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: The event, queued.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxEvent"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          description: "`event_not_found`: no event of this merchant has this id."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            `webhook_endpoint_not_found` or `webhook_endpoint_disabled`: there is
            nowhere to deliver to; register or fix the endpoint with a `PUT` first.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/webhook-endpoint:
    get:
      operationId: getWebhookEndpoint
      summary: The merchant's endpoint, and whether deliveries to it are stopped
      description: |
        Never shows the secret. `failing_since` is the first failed delivery with no
        success since. After 72 hours of only failures the endpoint is disabled
        (`disabled_at`, `disabled_reason`) and gets no posts: its events wait, and
        those older than 72 hours fail. Any `PUT`, with the same URL too, turns it
        back on.
      responses:
        "200":
          description: The endpoint as stored.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          description: "`webhook_endpoint_not_found`: none was registered."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    put:
      operationId: putWebhookEndpoint
      summary: Register or change where the merchant receives webhooks
      description: |
        One endpoint per merchant. The URL must be https on the public internet: an IP
        literal or name inside a private network, loopback or cloud metadata is refused
        here, and the IPs a name resolves to are checked again on every delivery.

        The signing secret is shown only on the first registration and on a rotation.
        To rotate it, send `rotate_secret_from` with the current `secret_version`.
        Repeating that same request, after a timeout for instance, does not rotate again:
        it shows the secret the first one created. A secret that was never received is
        recovered by rotating from the version returned.

        Any `PUT` turns a disabled endpoint back on (see the `GET`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutWebhookEndpointRequest"
      responses:
        "200":
          description: The endpoint as stored.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          description: "`secret_version_conflict`: `rotate_secret_from` is not the current version."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`invalid_webhook_url`: the URL is malformed or points inside a network."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "An API key: `Authorization: Bearer sk_test_...`."

  parameters:
    ChargebackId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ChargebackId"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Makes retries safe for 24 hours. A retry with the same key and the same request
        gets the stored answer, with `Idempotent-Replayed: true`; the same key with a
        different request is a 422 `idempotency_key_reused`.
      schema: { type: string, minLength: 1, maxLength: 255 }

  headers:
    RequestId:
      description: Also in error bodies and in the server logs.
      schema: { type: string }
    IdempotentReplayed:
      description: |
        Present on a stored answer replayed for a retry. Its body is the original one,
        including the request_id of the request that did the work.
      schema: { type: string, enum: ["true"] }

  responses:
    Problem:
      description: An RFC 9457 problem.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Idempotent-Replayed:
          $ref: "#/components/headers/IdempotentReplayed"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    PaymentNotFound:
      description: No such payment, as for `GET /v1/payments/{id}`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    AcquirerUnavailable:
      description: "`provider_unavailable`: the acquirer did not answer. Nothing changed; retry."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Money:
      type: object
      additionalProperties: false
      required: [value, currency]
      properties:
        value:
          type: integer
          format: int64
          description: Minor units. 2000 is 20.00.
        currency:
          type: string
          enum: [USD, BRL]

    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required: [amount, method, reference]
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        method:
          type: string
          enum: [pix, boleto, card]
          description: Each method takes its own field, `card` or `payer`, and refuses the other's.
        reference:
          type: string
          minLength: 1
          maxLength: 100
          description: The merchant's own reference, such as an order ID.
        card:
          $ref: "#/components/schemas/CardInput"
        payer:
          $ref: "#/components/schemas/PayerInput"

    PayerInput:
      type: object
      additionalProperties: false
      required: [name, document]
      description: >
        Whom a boleto is registered to (decision 54). Required for `method: boleto`,
        refused for any other (`payer_required`, `payer_not_allowed`). The CPF is
        checked by its digits (`invalid_payer_document`) and never shown back, in a
        response or a log.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Maria Silva
        document:
          type: string
          description: The payer's CPF, 11 digits, bare or as 123.456.789-09.
          example: 529.982.247-25
        email:
          type: string
          maxLength: 254
          example: maria@example.com

    CardInput:
      type: object
      additionalProperties: false
      required: [token]
      description: >
        Required for `method: card`, refused for any other (`card_required`,
        `card_not_allowed`). Only a token is ever accepted, never a card number
        (`invalid_card_token`). In test mode the token decides the issuer's answer:
        `tok_approved` is captured, `tok_declined` and `tok_insufficient_funds` are
        declined, and any other token is declined as invalid.
      properties:
        token:
          type: string
          minLength: 1
          example: tok_approved
        capture_method:
          type: string
          enum: [automatic, manual]
          default: automatic
          description: >
            `manual` only authorizes; the merchant captures within 7 days, or cancels
            to release the payer's limit at once.

    CapturePaymentRequest:
      type: object
      additionalProperties: false
      properties:
        amount:
          $ref: "#/components/schemas/Money"

    Quote:
      type: object
      additionalProperties: false
      required: [payer_amount, base_rate, fee, net_amount, expires_at]
      properties:
        payer_amount:
          $ref: "#/components/schemas/Money"
        base_rate:
          type: string
          pattern: "^[0-9]+\\.[0-9]{8}$"
          description: BRL per USD before the spread, with 8 decimal places.
        fee:
          $ref: "#/components/schemas/Money"
        net_amount:
          $ref: "#/components/schemas/Money"
        expires_at:
          type: string
          format: date-time

    EventId:
      type: string
      pattern: "^evt_[0-9a-z]{26}$"

    RefundId:
      type: string
      pattern: "^ref_[0-9a-z]{26}$"

    PaymentId:
      type: string
      pattern: "^pay_[0-9a-z]{26}$"

    PaymentStatus:
      type: string
      enum: [pending, paid, partially_refunded, refunded, charged_back, expired, canceled]

    PaymentEvent:
      description: |
        What the gateway posts to the merchant's webhook when a payment changes, at
        least once. Every delivery of one event sends the same bytes, so the merchant
        drops duplicates by `id`; `payment_version` grows with every transition, so an
        event older than the last one seen can be ignored. Only a 2xx answer counts as
        delivered; redirects are not followed.

        Each post carries `Webhook-Signature: t=<unix>,v1=<hex>`, the HMAC-SHA256 of
        `t`, a dot and the body, keyed by the endpoint's secret. Refuse a `t` more than
        5 minutes from now. For 24 hours after a rotation there is a second `v1`, from
        the previous secret; any `v1` that matches is enough.
      type: object
      additionalProperties: false
      required: [id, type, created_at, payment_id, payment_version, data]
      properties:
        id:
          $ref: "#/components/schemas/EventId"
        type:
          type: string
          enum: [payment.paid, payment.expired, payment.canceled]
        created_at:
          type: string
          format: date-time
        payment_id:
          $ref: "#/components/schemas/PaymentId"
        payment_version:
          type: integer
          minimum: 1
        data:
          type: object
          additionalProperties: false
          required: [status, amount]
          properties:
            status:
              $ref: "#/components/schemas/PaymentStatus"
            amount:
              $ref: "#/components/schemas/Money"

    RefundRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          $ref: "#/components/schemas/Money"

    Refund:
      type: object
      additionalProperties: false
      required: [id, payment_id, status, amount, payer_amount, created_at]
      properties:
        id:
          $ref: "#/components/schemas/RefundId"
        payment_id:
          $ref: "#/components/schemas/PaymentId"
        status:
          type: string
          enum: [pending, succeeded, failed]
          description: |
            `pending` while the provider has not answered for sure; the webhook tells
            how it ends.
        amount:
          $ref: "#/components/schemas/Money"
        payer_amount:
          $ref: "#/components/schemas/Money"
        created_at:
          type: string
          format: date-time

    RefundEvent:
      description: |
        Posted when a refund ends, signed and delivered like PaymentEvent.
        `payment_version` orders it with the payment's own events: a succeeded refund
        moves the payment, a failed one does not.
      type: object
      additionalProperties: false
      required: [id, type, created_at, payment_id, payment_version, data]
      properties:
        id:
          $ref: "#/components/schemas/EventId"
        type:
          type: string
          enum: [refund.succeeded, refund.failed]
        created_at:
          type: string
          format: date-time
        payment_id:
          $ref: "#/components/schemas/PaymentId"
        payment_version:
          type: integer
          minimum: 1
        data:
          type: object
          additionalProperties: false
          required: [refund_id, amount, payment_status]
          properties:
            refund_id:
              $ref: "#/components/schemas/RefundId"
            amount:
              $ref: "#/components/schemas/Money"
            payment_status:
              $ref: "#/components/schemas/PaymentStatus"

    ChargebackId:
      type: string
      pattern: "^cbk_[0-9a-z]{26}$"

    Chargeback:
      type: object
      additionalProperties: false
      required: [id, payment_id, status, reason, payer_amount, amount, evidence, created_at, closed_at]
      properties:
        id:
          $ref: "#/components/schemas/ChargebackId"
        payment_id:
          $ref: "#/components/schemas/PaymentId"
        status:
          type: string
          enum: [needs_response, under_review, won, lost]
        reason:
          type: string
          description: Why the cardholder disputed, as the acquirer said it.
        payer_amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: What the cardholder's bank took back, in BRL.
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: >-
            What the merchant lost with it, in USD: the same share of the payment, the
            fee kept, as for a refund. A won chargeback gives exactly this back.
        evidence:
          type: string
          nullable: true
          description: What the merchant contested with; null until contested.
        created_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: When it was won or lost.

    ContestChargebackRequest:
      type: object
      additionalProperties: false
      required: [evidence]
      properties:
        evidence:
          type: string
          minLength: 1
          maxLength: 2000
          example: Refunded in full on 2026-11-05, refund ref_...

    ChargebackEvent:
      description: |
        Posted when a chargeback opens, is won or is lost, signed and delivered like
        PaymentEvent. `amount` is what the merchant lost when it opened, or got back
        when won. Each moves `payment_version`, ordering it with the payment's events.
      type: object
      additionalProperties: false
      required: [id, type, created_at, payment_id, payment_version, data]
      properties:
        id:
          $ref: "#/components/schemas/EventId"
        type:
          type: string
          enum: [chargeback.opened, chargeback.won, chargeback.lost]
        created_at:
          type: string
          format: date-time
        payment_id:
          $ref: "#/components/schemas/PaymentId"
        payment_version:
          type: integer
          minimum: 1
        data:
          type: object
          additionalProperties: false
          required: [chargeback_id, status, reason, amount, payment_status]
          properties:
            chargeback_id:
              $ref: "#/components/schemas/ChargebackId"
            status:
              type: string
              enum: [needs_response, under_review, won, lost]
            reason:
              type: string
            amount:
              $ref: "#/components/schemas/Money"
            payment_status:
              $ref: "#/components/schemas/PaymentStatus"

    EventList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OutboxEvent"
        next_cursor:
          type: string
          nullable: true
          description: Pass it as `cursor` for the next page; null on the last page.

    OutboxEvent:
      type: object
      additionalProperties: false
      required: [event, delivery]
      properties:
        event:
          oneOf:
            - $ref: "#/components/schemas/PaymentEvent"
            - $ref: "#/components/schemas/RefundEvent"
            - $ref: "#/components/schemas/ChargebackEvent"
        delivery:
          type: object
          additionalProperties: false
          required: [status, attempts, next_attempt_at, last_status_code, last_error, finished_at]
          properties:
            status:
              type: string
              enum: [pending, delivered, failed]
            attempts:
              type: integer
              minimum: 0
              description: Posts tried so far, across every retry window.
            next_attempt_at:
              type: string
              format: date-time
              nullable: true
              description: When a pending event is tried next; null once delivered or failed.
            last_status_code:
              type: integer
              nullable: true
              description: What the endpoint answered last; null when no answer came.
            last_error:
              type: string
              nullable: true
            finished_at:
              type: string
              format: date-time
              nullable: true
              description: When it was delivered or given up.

    Balance:
      type: object
      additionalProperties: false
      required: [available, pending, reserved]
      properties:
        available:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: >-
            What a settlement run now would pay before its reserve hold. Negative when
            refunds or chargebacks of settled money exceed what came in since; the next
            settlement covers it from the reserve, and new payments are refused once
            available plus reserved is below -US$ 1,000.00.
        pending:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Confirmed money not available yet, by each method's days.
        reserved:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: >-
            Held against chargebacks: 10% of each settlement, released 90 days after its
            cutoff.

    SettlementList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Settlement"
        next_cursor:
          type: string
          nullable: true
          description: Pass it as `cursor` for the next page; null on the last page.

    Settlement:
      type: object
      additionalProperties: false
      required: [id, cutoff_date, amount, reserved, reserve_until, payments, created_at]
      properties:
        id:
          type: string
          pattern: "^stl_[0-9a-z]{26}$"
        cutoff_date:
          type: string
          format: date
          description: The São Paulo local date the settlement belongs to.
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: What was paid out; amount plus reserved was available.
        reserved:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: What was held in the reserve, rounded down.
        reserve_until:
          type: string
          format: date
          nullable: true
          description: The cutoff date the hold is released on; null when nothing was held.
        payments:
          type: array
          description: The payments that became available for this settlement.
          items:
            $ref: "#/components/schemas/PaymentId"
        created_at:
          type: string
          format: date-time

    PaymentList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        next_cursor:
          type: string
          nullable: true
          description: Pass it as `cursor` for the next page; null on the last page.

    Payment:
      type: object
      additionalProperties: false
      required: [id, status, method, amount, reference, quote, created_at]
      properties:
        id:
          $ref: "#/components/schemas/PaymentId"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        method:
          type: string
          enum: [pix, boleto, card]
        amount:
          $ref: "#/components/schemas/Money"
        reference:
          type: string
        quote:
          $ref: "#/components/schemas/Quote"
        pix:
          $ref: "#/components/schemas/Pix"
        card:
          $ref: "#/components/schemas/Card"
        boleto:
          $ref: "#/components/schemas/Boleto"
        created_at:
          type: string
          format: date-time

    Boleto:
      type: object
      additionalProperties: false
      required: [status, due_date]
      description: >
        The boleto for the payer, as `pix` is for PIX. `ready` carries the barcode and
        the linha digitável to print or copy. `processing` means the bank's answer is
        not known yet: fetch the payment again later. `failed` means the bank refused
        to register it; create a new payment. The bank receives it until the end of the
        first banking day on or after `due_date` and refuses it after.
      properties:
        status:
          type: string
          enum: [ready, processing, failed]
        due_date:
          type: string
          format: date
          example: "2026-11-17"
        barcode:
          type: string
          pattern: "^[0-9]{44}$"
          description: The 44 digits of the barcode (Febraban), present when status is ready.
        digitable_line:
          type: string
          pattern: "^[0-9]{5}\\.[0-9]{5} [0-9]{5}\\.[0-9]{6} [0-9]{5}\\.[0-9]{6} [0-9] [0-9]{14}$"
          description: The linha digitável, 47 digits as a boleto prints them, present when status is ready.
          example: 99990.00129 34555.160448 59793.093283 6 16300000000100

    Pix:
      type: object
      additionalProperties: false
      required: [status]
      description: >
        The PIX code for the payer. `ready` carries the BR Code to show as text or QR.
        `processing` means the provider's answer is not known yet: fetch the payment
        again later. `failed` means the provider refused, and this payment cannot be
        paid; create a new one.
      properties:
        status:
          type: string
          enum: [ready, processing, failed]
        br_code:
          type: string
          description: The BR Code (EMV payload with CRC16), present when status is ready.

    Card:
      type: object
      additionalProperties: false
      description: >
        Where the card stands, on a card payment. `captured` means the money was
        taken and the payment is paid. `processing` means the acquirer's answer is not
        known yet: fetch the payment again later. `declined` means the issuer refused,
        and this payment cannot be paid; create a new one. `authorized` is a hold
        waiting for `POST /v1/payments/{id}/capture`. `released` is an authorization
        of a payment canceled or expired before capture.
      required: [status, capture_method]
      properties:
        status:
          type: string
          enum: [processing, authorized, captured, declined, released]
        capture_method:
          type: string
          enum: [automatic, manual]
        captured:
          type: object
          additionalProperties: false
          required: [amount, payer_amount, fee, net_amount]
          description: >
            What the capture took, priced at the payment's rate. Equal to `quote` for a
            whole capture; for a partial one, the fee and the net are on the captured
            amount.
          properties:
            amount:
              $ref: "#/components/schemas/Money"
            payer_amount:
              $ref: "#/components/schemas/Money"
            fee:
              $ref: "#/components/schemas/Money"
            net_amount:
              $ref: "#/components/schemas/Money"

    PutWebhookEndpointRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
          example: https://gamestore.example/webhooks
        rotate_secret_from:
          type: integer
          minimum: 1
          description: The current `secret_version`, to get a new secret.
    WebhookEndpoint:
      type: object
      additionalProperties: false
      required: [url, secret_version, created_at, updated_at]
      properties:
        url:
          type: string
        secret_version:
          type: integer
          minimum: 1
        secret:
          type: string
          pattern: "^whsec_[A-Za-z0-9_-]{43}$"
          description: |
            Signs every webhook (HMAC-SHA256). Present only on the first registration and
            on a rotation; it is not stored and cannot be read back.
        failing_since:
          type: string
          format: date-time
          description: The first failed delivery with no success since; absent after a success.
        disabled_at:
          type: string
          format: date-time
          description: Set when 72 hours of only failures stopped deliveries.
        disabled_reason:
          type: string
          description: Why deliveries stopped, with the last failure.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable, machine-readable cause, e.g. invalid_amount.
        request_id: { type: string }
