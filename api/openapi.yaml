openapi: 3.0.3
info:
  title: Cross-border Pay
  version: 0.1.0
  description: |
    A merchant abroad charges in USD; a payer in Brazil pays in BRL. Every amount is an
    integer in minor units (2000 is US$ 20.00); a decimal value is rejected. Errors are
    RFC 9457 problem details with a stable `code`.
servers:
  - url: http://localhost:8080
security:
  - apiKey: []

paths:
  /v1/payments:
    post:
      operationId: createPayment
      summary: Create a payment, priced in BRL by a quote valid for 30 minutes (PIX)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
            example:
              amount: { value: 2000, currency: USD }
              method: pix
              reference: order-123
      responses:
        "201":
          description: The payment, pending until the payer pays.
          headers:
            Location:
              schema: { type: string, example: /v1/payments/pay_06f1z4ghq3m5ttqb0gnsx4yy3c }
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          description: |
            `idempotency_key_in_progress`: another request with this Idempotency-Key is
            still running. Retry later; it is never answered for a finished request.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listPayments
      summary: List the merchant's payments, newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page. Opaque.
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PaymentStatus"
      responses:
        "200":
          description: One page of payments.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/payments/{id}:
    get:
      operationId: getPayment
      summary: Get one of the merchant's payments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PaymentId"
      responses:
        "200":
          description: The payment and the quote that priced it.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          description: |
            No such payment. Also the answer for another merchant's payment and for a
            malformed ID, so it never tells whether a payment exists.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/providers/{provider}/events:
    post:
      operationId: receiveProviderEvent
      summary: Receive an event from a payment provider (webhook)
      description: |
        Called by the provider, not by merchants: the provider's signature is the
        authentication. The event is only stored here and applied by the worker
        (decision 19). A redelivered event is answered 200 too, so the provider stops
        sending it; only a failure to store asks for a redelivery.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            example: pixsim
        - name: Pixsim-Signature
          in: header
          required: false
          description: The simulator's signature, `t=<unix>,v1=<hex HMAC-SHA256 of t.body>`.
          schema:
            type: string
      requestBody:
        required: true
        description: The event exactly as the provider signed it.
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Stored, or already stored by an earlier delivery.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [received]
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "An API key: `Authorization: Bearer sk_test_...`."

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Makes retries safe for 24 hours. A retry with the same key and the same request
        gets the stored answer, with `Idempotent-Replayed: true`; the same key with a
        different request is a 422 `idempotency_key_reused`.
      schema: { type: string, minLength: 1, maxLength: 255 }

  headers:
    RequestId:
      description: Also in error bodies and in the server logs.
      schema: { type: string }
    IdempotentReplayed:
      description: |
        Present on a stored answer replayed for a retry. Its body is the original one,
        including the request_id of the request that did the work.
      schema: { type: string, enum: ["true"] }

  responses:
    Problem:
      description: An RFC 9457 problem.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Idempotent-Replayed:
          $ref: "#/components/headers/IdempotentReplayed"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Money:
      type: object
      additionalProperties: false
      required: [value, currency]
      properties:
        value:
          type: integer
          format: int64
          description: Minor units. 2000 is 20.00.
        currency:
          type: string
          enum: [USD, BRL]

    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required: [amount, method, reference]
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        method:
          type: string
          enum: [pix, boleto, card]
          description: Only pix is available now; boleto and card answer 422 until F8.
        reference:
          type: string
          minLength: 1
          maxLength: 100
          description: The merchant's own reference, such as an order ID.

    Quote:
      type: object
      additionalProperties: false
      required: [payer_amount, base_rate, fee, net_amount, expires_at]
      properties:
        payer_amount:
          $ref: "#/components/schemas/Money"
        base_rate:
          type: string
          pattern: "^[0-9]+\\.[0-9]{8}$"
          description: BRL per USD before the spread, with 8 decimal places.
        fee:
          $ref: "#/components/schemas/Money"
        net_amount:
          $ref: "#/components/schemas/Money"
        expires_at:
          type: string
          format: date-time

    PaymentId:
      type: string
      pattern: "^pay_[0-9a-z]{26}$"

    PaymentStatus:
      type: string
      enum: [pending, paid, partially_refunded, refunded, charged_back, expired, canceled]

    PaymentEvent:
      description: |
        What the gateway posts to the merchant's webhook (delivery arrives in F6) when a
        payment changes. Every delivery of one event sends the same bytes, so the
        merchant drops duplicates by `id`; `payment_version` grows with every
        transition, so an event older than the last one seen can be ignored.
      type: object
      additionalProperties: false
      required: [id, type, created_at, payment_id, payment_version, data]
      properties:
        id:
          type: string
          pattern: "^evt_[0-9a-z]{26}$"
        type:
          type: string
          enum: [payment.paid]
        created_at:
          type: string
          format: date-time
        payment_id:
          $ref: "#/components/schemas/PaymentId"
        payment_version:
          type: integer
          minimum: 1
        data:
          type: object
          additionalProperties: false
          required: [status, amount]
          properties:
            status:
              $ref: "#/components/schemas/PaymentStatus"
            amount:
              $ref: "#/components/schemas/Money"

    PaymentList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        next_cursor:
          type: string
          nullable: true
          description: Pass it as `cursor` for the next page; null on the last page.

    Payment:
      type: object
      additionalProperties: false
      required: [id, status, method, amount, reference, quote, created_at]
      properties:
        id:
          $ref: "#/components/schemas/PaymentId"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        method:
          type: string
          enum: [pix, boleto, card]
        amount:
          $ref: "#/components/schemas/Money"
        reference:
          type: string
        quote:
          $ref: "#/components/schemas/Quote"
        pix:
          $ref: "#/components/schemas/Pix"
        created_at:
          type: string
          format: date-time

    Pix:
      type: object
      additionalProperties: false
      required: [status]
      description: >
        The PIX code for the payer. `ready` carries the BR Code to show as text or QR.
        `processing` means the provider's answer is not known yet: fetch the payment
        again later. `failed` means the provider refused, and this payment cannot be
        paid; create a new one.
      properties:
        status:
          type: string
          enum: [ready, processing, failed]
        br_code:
          type: string
          description: The BR Code (EMV payload with CRC16), present when status is ready.

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable, machine-readable cause, e.g. invalid_amount.
        request_id: { type: string }
