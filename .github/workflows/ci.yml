name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run fmt:check
      - run: mise run gen:check
      - run: mise run lint
      - name: mise run test:cover
        # An explicit bash runs with pipefail; the default shell does not, and the tee
        # below would turn every failing test into a green step.
        shell: bash
        run: |
          mise run test:cover | tee coverage.txt
          {
            echo '### Cobertura'
            echo '```'
            grep -E '^(total:|github.com)' coverage.txt | tail -n 50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: mise run vuln

  # What someone who clones does (docs/f11.md): the whole stack from compose.yaml.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build
      - name: wait for the API and the simulators
        run: |
          for url in localhost:8080/readyz localhost:8090/healthz localhost:8091/healthz localhost:8092/healthz; do
            timeout 60 sh -c "until curl -sf $url >/dev/null; do sleep 1; done" || { echo "$url never answered"; exit 1; }
          done
      - if: failure()
        run: docker compose logs
