services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: cbp
      POSTGRES_PASSWORD: cbp
      POSTGRES_DB: cbp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbp -d cbp"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
