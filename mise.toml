[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
sqlc = "1.31.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

[env]
DATABASE_URL = "postgres://cbp:cbp@localhost:5432/cbp?sslmode=disable"
# Dev only: signs the simulator's events. A real deployment sets its own.
PIXSIM_WEBHOOK_SECRET = "dev-pixsim-webhook-secret"
# Where the simulator posts its events: the local API's webhook.
PIXSIM_WEBHOOK_URL = "http://localhost:8080/v1/providers/pixsim/events"
# Dev only: derives the merchants' webhook secrets. A real deployment sets its own.
WEBHOOK_SIGNING_KEY = "dev-webhook-signing-key-0123456789abcdef"
# Dev only: lets webhooks reach a local fake merchant over http.
WEBHOOK_ALLOW_PRIVATE = "true"

[tasks.fmt]
description = "Formata o código (gofumpt + goimports pela config do golangci-lint)"
run = "golangci-lint fmt"

[tasks."fmt:check"]
description = "Falha se algum arquivo não estiver formatado"
run = "golangci-lint fmt --diff"

[tasks.lint]
description = "golangci-lint, que já roda o govet"
run = "golangci-lint run"

[tasks.test]
description = "Testes com o detector de corrida"
run = "go test -race ./..."

[tasks."test:cover"]
description = "Testes com o detector de corrida e relatório de cobertura"
run = [
  "go test -race -coverprofile=coverage.out ./...",
  "go tool cover -func=coverage.out",
]

[tasks."test:stress"]
description = "Testes repetidos 100 vezes com o detector de corrida, e o e2e 10 vezes, como o job noturno"
# 100 rounds of the integration packages take over 10 min, go test's default. The e2e
# tests wiring, not races: 100 of its ~18 s rounds would add 30 min for little.
run = [
  "go test -race -count=100 -timeout=60m $(go list ./... | grep -v /e2e$)",
  "go test -race -count=10 -timeout=20m ./e2e/",
]

[tasks.e2e]
description = "Roteiro GameStore ponta a ponta: api, worker e pixsim como processos, com Postgres real"
run = "go test -race -count=1 ./e2e/"

[tasks.vuln]
description = "Vulnerabilidades conhecidas no código e nas dependências"
run = "govulncheck ./..."

[tasks.gen]
description = "Gera o código do sqlc a partir das migrations e das queries"
run = "sqlc generate"

[tasks."gen:check"]
description = "Falha se o código gerado pelo sqlc estiver desatualizado"
run = "sqlc diff"

[tasks.db]
description = "Sobe o Postgres local (compose.yaml) e espera ficar saudável"
run = "docker compose up -d --wait"

[tasks.migrate]
description = "Aplica as migrations embutidas no DATABASE_URL"
run = "go run ./cmd/migrate"

[tasks.pixsim]
description = "Sobe o simulador PIX (PIXSIM_ADDR, padrão :8090; PIXSIM_SEED, padrão 1; eventos para PIXSIM_WEBHOOK_URL)"
run = "go run ./cmd/pixsim"
